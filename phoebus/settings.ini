# Phoebus client settings for the EPICS Lab stack.
#
# Run Phoebus on your desktop with:
#   phoebus.sh -settings /path/to/epics-lab/phoebus/settings.ini
#
# All PV traffic goes through the gateways published on localhost; adjust the
# host names if the stack runs on another machine (see also
# KAFKA_EXTERNAL_HOST in .env for the alarm connection).

# Channel Access through the CA gateway
org.phoebus.pv/default=ca
org.phoebus.pv.ca/addr_list=localhost\:5064
org.phoebus.pv.ca/auto_addr_list=false

# PV Access through the PVA gateway
org.phoebus.pv.pva/epics_pva_addr_list=localhost
org.phoebus.pv.pva/epics_pva_auto_addr_list=false

# Alarm system (Kafka external listener)
org.phoebus.applications.alarm/server=localhost\:9092
org.phoebus.applications.alarm/config_name=Lab
org.phoebus.applications.alarm/config_names=Lab

# ChannelFinder directory service
org.phoebus.channelfinder/serviceURL=http\://localhost\:8080/ChannelFinder

# Data Browser -> Archiver Appliance
org.csstudio.trends.databrowser3/urls=pbraw\://localhost\:17665/retrieval
org.csstudio.trends.databrowser3/archives=pbraw\://localhost\:17665/retrieval
org.csstudio.trends.databrowser3/use_default_archives=true

# Open the top-level display on startup via: File > Open > phoebus/displays/main.bob
