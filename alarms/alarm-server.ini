# Phoebus alarm server settings (runs inside the compose network).

# Kafka broker and alarm configuration topic
org.phoebus.applications.alarm/server=kafka:29092
org.phoebus.applications.alarm/config_name=Lab
org.phoebus.applications.alarm/config_names=Lab

# Talk directly to the IOCs over Channel Access
org.phoebus.pv/default=ca
org.phoebus.pv.ca/addr_list=ioc-cryo ioc-vacuum ioc-motion
org.phoebus.pv.ca/auto_addr_list=false
