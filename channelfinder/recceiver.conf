# RecSync server configuration.
#
# recceiver announces itself by UDP broadcast; reccaster (in every IOC)
# hears the announcement and connects back over TCP to upload its record
# list and environment.

[recceiver]
loglevel = INFO

# Listen for client connections on any interface, ephemeral port.
bind = 0.0.0.0:0

# Announcement destination: broadcast address of the fixed compose subnet
# (172.28.0.0/16 — keep in sync with `networks:` in compose.yaml).
addrlist = 172.28.255.255:5049

# Processing chain: log a summary, then sync to ChannelFinder.
procs = show, cf

# Refresh ChannelFinder state on restarts.
cleanOnStart = True
cleanOnStop = True

[cf]
# Must match demo_auth in channelfinder/application.properties.
baseUrl = http://channelfinder:8080/ChannelFinder
cfUsername = admin
cfPassword = adminPass
verifySSL = False

# Enrich channels with aliases, record types, and descriptions.
alias = True
recordType = True
recordDesc = True
