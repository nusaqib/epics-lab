# ChannelFinder site settings (mounted into the channelfinder container).

# Plain HTTP on 8080 inside the compose network; HTTPS stays on the default
# 8443 (self-signed) and is not published to the host.
server.port=8443
server.http.enable=true
server.http.port=8080

# Elasticsearch backend
elasticsearch.network.host=channelfinder-es
elasticsearch.http.port=9200
elasticsearch.create.indices=true

# Development authentication: in-memory demo accounts. Reads are anonymous;
# writes (recceiver) authenticate as `admin`. Replace with LDAP/AD before
# exposing beyond a trusted network — see docs/operations.md.
demo_auth.enabled=true
demo_auth.users=admin
demo_auth.pwds=adminPass
demo_auth.roles=ADMIN
embedded_ldap.enabled=false
ldap.enabled=false
ad.enabled=false
