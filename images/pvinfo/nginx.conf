server {
    listen 8080;
    server_name _;

    # Relative redirects: the container port (8080) differs from the
    # published host port.
    absolute_redirect off;

    # Re-resolve compose service names so backend restarts don't strand us
    # on a stale IP.
    resolver 127.0.0.11 valid=10s;

    # PV Info SPA (built with base /pvinfo)
    location /pvinfo/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pvinfo/index.html;
    }
    location = /pvinfo {
        return 302 /pvinfo/;
    }
    location = / {
        return 302 /pvinfo/;
    }

    # Same-origin proxies (ChannelFinder has no CORS configuration)
    location /ChannelFinder/ {
        set $cf channelfinder:8080;
        proxy_pass http://$cf$request_uri;
        proxy_set_header Host $host;
    }
    location /retrieval/ {
        set $aa archiver:17665;
        proxy_pass http://$aa$request_uri;
        proxy_set_header Host $host;
    }
}
